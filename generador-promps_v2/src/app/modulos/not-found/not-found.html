<div class="bg-surface-container-lowest min-h-screen flex flex-col items-center justify-center p-8">
  <div class="text-center max-w-md">

    <div class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center mx-auto mb-8">
      <span class="material-symbols-outlined text-primary text-5xl">search_off</span>
    </div>

    <h1 class="font-headline text-8xl font-bold text-primary mb-4">404</h1>

    <h2 class="font-headline text-2xl font-bold text-on-surface mb-4">
      Página no encontrada
    </h2>

    <p class="text-on-surface-variant mb-8 leading-relaxed">
      La ruta que buscas no existe o fue movida. Regresa al dashboard para continuar.
    </p>

    <button
      (click)="irDashboard()"
      class="poly-gradient text-on-primary-container font-bold py-4 px-8 rounded-xl active:scale-95 transition-all flex items-center gap-3 mx-auto">
      <span class="material-symbols-outlined">arrow_back</span>
      Volver al Dashboard
    </button>

  </div>
</div>
